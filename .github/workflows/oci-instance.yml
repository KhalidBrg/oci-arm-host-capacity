<?php
declare(strict_types=1);

$pathPrefix = '';
require "{$pathPrefix}vendor/autoload.php";

use Dotenv\Dotenv;
use Hitrov\Exception\ApiCallException;
use Hitrov\FileCache;
use Hitrov\OciApi;
use Hitrov\OciConfig;
use Hitrov\TooManyRequestsWaiter;

// Load .env only if it exists (for local development)
if (file_exists(__DIR__ . '/.env')) {
    $envFilename = empty($argv[1]) ? '.env' : $argv[1];
    $dotenv = Dotenv::createUnsafeImmutable(__DIR__, $envFilename);
    $dotenv->safeLoad();
}

$config = new OciConfig(
    getenv('OCI_REGION'),
    getenv('OCI_USER_ID'),
    getenv('OCI_TENANCY_ID'),
    getenv('OCI_KEY_FINGERPRINT'),
    getenv('OCI_PRIVATE_KEY_FILENAME'),
    getenv('OCI_AVAILABILITY_DOMAIN') ?: null,
    getenv('OCI_SUBNET_ID'),
    getenv('OCI_IMAGE_ID'),
    (int) getenv('OCI_OCPUS'),
    (int) getenv('OCI_MEMORY_IN_GBS')
);

$api = new OciApi();
$fileCache = new FileCache();

$maxInstances = (int) getenv('OCI_MAX_INSTANCES');

// Check current instance count
$instances = $api->getInstances($config);
$runningInstances = array_filter($instances, function($instance) {
    return $instance['lifecycleState'] !== 'TERMINATED';
});

echo "=== INSTANCE STATUS ===\n";
echo "Running instances: " . count($runningInstances) . "\n";
echo "Max allowed: " . $maxInstances . "\n";

if (count($runningInstances) >= $maxInstances) {
    echo "Maximum instances reached. Exiting.\n";
    exit(0);
}

echo "\n=== SSH KEY DEBUG ===\n";
$sshKeyRaw = getenv('OCI_SSH_PUBLIC_KEY');
echo "Raw key length: " . strlen($sshKeyRaw) . "\n";
echo "First 50 chars: " . substr($sshKeyRaw, 0, 50) . "\n";
echo "Last 50 chars: " . substr($sshKeyRaw, -50) . "\n";

// Clean SSH key
$sshKeyCleaned = preg_replace('/\s+/', ' ', trim($sshKeyRaw));
$sshKeyNoBackslash = str_replace('\\', '', $sshKeyCleaned);

echo "Cleaned key length: " . strlen($sshKeyNoBackslash) . "\n";
echo "\n======================\n\n";

try {
    $waiter = new TooManyRequestsWaiter($api, $fileCache, $config);
    $response = $waiter->launch();
    
    echo "\n=== SUCCESS ===\n";
    echo "Instance created successfully!\n";
    echo "Response: " . json_encode($response, JSON_PRETTY_PRINT) . "\n";
    
} catch (ApiCallException $e) {
    echo "\n=== API ERROR ===\n";
    echo "Error message: " . $e->getMessage() . "\n";
    echo "Error code: " . $e->getCode() . "\n";
    
    // Try to get more details from the exception
    $reflection = new ReflectionClass($e);
    $properties = $reflection->getProperties();
    
    echo "\n=== EXCEPTION DETAILS ===\n";
    foreach ($properties as $property) {
        $property->setAccessible(true);
        $value = $property->getValue($e);
        if (!empty($value) && !is_object($value)) {
            echo $property->getName() . ": " . print_r($value, true) . "\n";
        }
    }
    
    throw $e;
    
} catch (Exception $e) {
    echo "\n=== GENERAL ERROR ===\n";
    echo "Error: " . $e->getMessage() . "\n";
    echo "Trace: " . $e->getTraceAsString() . "\n";
    throw $e;
}
