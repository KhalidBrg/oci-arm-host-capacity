name: Debug Secrets

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'

    - name: Check secret values (masked)
      env:
        OCI_REGION: ${{ secrets.OCI_REGION }}
        OCI_SHAPE: ${{ secrets.OCI_SHAPE }}
        OCI_OCPUS: ${{ secrets.OCI_OCPUS }}
        OCI_MEMORY_IN_GBS: ${{ secrets.OCI_MEMORY_IN_GBS }}
        OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
        OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
        OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
      run: |
        echo "=== Checking secret formats ==="
        echo "OCI_REGION length: ${#OCI_REGION}"
        echo "OCI_SHAPE length: ${#OCI_SHAPE}"
        echo "OCI_OCPUS: $OCI_OCPUS (should be a number)"
        echo "OCI_MEMORY_IN_GBS: $OCI_MEMORY_IN_GBS (should be a number)"
        echo "OCI_IMAGE_ID starts with: ${OCI_IMAGE_ID:0:10}..."
        echo "OCI_SUBNET_ID starts with: ${OCI_SUBNET_ID:0:10}..."
        echo "OCI_SSH_PUBLIC_KEY starts with: ${OCI_SSH_PUBLIC_KEY:0:20}..."
        echo ""
        echo "=== Checking for common issues ==="
        
        # Check for whitespace
        if [[ "$OCI_OCPUS" =~ [[:space:]] ]]; then
          echo "⚠️  OCI_OCPUS contains whitespace!"
        fi
        
        if [[ "$OCI_MEMORY_IN_GBS" =~ [[:space:]] ]]; then
          echo "⚠️  OCI_MEMORY_IN_GBS contains whitespace!"
        fi
        
        # Check if numeric
        if ! [[ "$OCI_OCPUS" =~ ^[0-9]+$ ]]; then
          echo "❌ OCI_OCPUS is not a valid number!"
        else
          echo "✅ OCI_OCPUS is numeric"
        fi
        
        if ! [[ "$OCI_MEMORY_IN_GBS" =~ ^[0-9]+$ ]]; then
          echo "❌ OCI_MEMORY_IN_GBS is not a valid number!"
        else
          echo "✅ OCI_MEMORY_IN_GBS is numeric"
        fi
